# Applied on the next agent-run start (daemon-reload only; do not restart a live round).
# Context values match jarvis-engine --ctx-size 131072; output is 256k (262144).
[Service]
Environment=CLAUDE_CODE_MAX_CONTEXT_TOKENS=131072
Environment=CLAUDE_CODE_MAX_OUTPUT_TOKENS=262144
Environment=CLAUDE_CODE_AUTO_COMPACT_WINDOW=131072
Environment=ANTHROPIC_CUSTOM_MODEL_OPTION=jarvis-brain
Environment=ANTHROPIC_CUSTOM_MODEL_OPTION_NAME=jarvis-brain

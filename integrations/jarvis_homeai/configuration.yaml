# Jarvis HomeAI Home Assistant Configuration
#
# Copy these settings into your Home Assistant configuration.
# See README.md for installation instructions.
#
# === 1. Input Booleans (switches) ===
#
# Add to configuration.yaml:
#
# input_boolean:
#   job_announce:
#     name: "Jarvis Job Announcements"
#     initial: on
#     icon: "mdi:volume-source"
#
# This switch controls whether Jarvis announces job completions
# via TTS to all speakers when you are home.
#
# === 2. REST Sensors (poll Jarvis metrics) ===
#
# These sensors pull real-time data from the Jarvis system.
# Add to configuration.yaml:
#
# rest:
#   resource: "http://localhost:9101/metrics"
#   method: GET
#   scan_interval: 30
#   sensor:
#     - name: "Jarvis Jobs Completed"
#       unique_id: "jarvis_jobs_completed"
#       value_template: "{{ value | regex_findall_index('jarvis_jobs_completed\\s+([0-9]+)', 1) | default('0') }}"
#       device_class: "timestamp"
#       unit_of_measurement: "jobs"
#     - name: "Jarvis Jobs Failed"
#       unique_id: "jarvis_jobs_failed"
#       value_template: "{{ value | regex_findall_index('jarvis_jobs_failed\\s+([0-9]+)', 1) | default('0') }}"
#       unit_of_measurement: "jobs"
#     - name: "Jarvis Requests Total"
#       unique_id: "jarvis_requests_total"
#       value_template: "{{ value | regex_findall_index('jarvis_requests_total\\s+([0-9]+)', 1) | default('0') }}"
#       unit_of_measurement: "requests"
#

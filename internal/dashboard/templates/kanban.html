{{ define "kanban.html" }}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Kanban Board</title>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --fg: #c9d1d9;
    --muted: #8b949e;
    --border: #30363d;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --card: #161b22;
    --card-hover: #1c2129;
    --col-bg: #0f1318;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 0;
  }

  /* Top nav bar */
  .topbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar h1 {
    font-size: 1.1rem;
    font-weight: 600;
  }
  .topbar a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .topbar a:hover { color: var(--fg); }
  .topbar .spacer { flex: 1; }
  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 500;
    background: var(--card);
    color: var(--fg);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--card-hover); }
  .btn-primary {
    border-color: var(--green);
    color: var(--green);
  }
  .btn-primary:hover { background: rgba(63,184,80,0.1); }
  .btn-danger {
    border-color: var(--red);
    color: var(--red);
  }
  .btn-danger:hover { background: rgba(248,81,73,0.1); }
  .btn-sm { padding: 3px 8px; font-size: 0.7rem; }

  /* Epic selector tabs */
  .epic-tabs {
    display: flex;
    gap: 0;
    padding: 12px 24px 0;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 49px;
    z-index: 99;
  }
  .epic-tab {
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }
  .epic-tab:hover { color: var(--fg); }
  .epic-tab.active {
    color: var(--fg);
    border-bottom-color: var(--blue);
  }
  .epic-tab .count {
    color: var(--muted);
    font-size: 0.75rem;
    margin-left: 4px;
  }

  /* Kanban board layout */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 16px 24px;
    min-height: calc(100vh - 120px);
  }
  .column {
    background: var(--col-bg);
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .col-header {
    padding: 12px 16px;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .col-header .col-count {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 0.7rem;
    font-weight: 400;
  }
  .col-body {
    padding: 8px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }

  /* Task cards */
  .task-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .task-card:hover {
    border-color: var(--blue);
  }
  .task-title {
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .task-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 0.7rem;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .badge-model {
    color: var(--blue);
    border-color: rgba(88,166,255,0.3);
  }
  .badge-priority {
    font-weight: 600;
  }
  .task-subtasks {
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .subtask-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 4px;
    overflow: hidden;
  }
  .subtask-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.2s;
  }

  /* Add task button in column */
  .add-task-btn {
    padding: 8px;
    border: 1px dashed var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
    text-align: center;
  }
  .add-task-btn:hover {
    border-color: var(--blue);
    color: var(--blue);
  }

  /* Modal overlay */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 90%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-size: 1.1rem;
    margin-bottom: 16px;
  }
  .form-group {
    margin-bottom: 12px;
  }
  .form-group label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    font-size: 0.85rem;
    font-family: inherit;
  }
  .form-group textarea {
    min-height: 80px;
    resize: vertical;
  }
  .form-group select {
    cursor: pointer;
  }
  .form-group select option {
    background: var(--card);
  }
  .form-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 16px;
  }

  /* Task detail modal */
  .detail-section {
    margin-bottom: 16px;
  }
  .detail-section h3 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .detail-content {
    font-size: 0.85rem;
    line-height: 1.5;
    white-space: pre-wrap;
    color: var(--fg);
  }
  .detail-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  .detail-row label {
    font-size: 0.8rem;
    color: var(--muted);
    min-width: 70px;
  }
  .detail-row select,
  .detail-row input {
    flex: 1;
    padding: 4px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--fg);
    font-size: 0.8rem;
  }
  .detail-row select option {
    background: var(--card);
  }

  /* Subtask checklist */
  .checklist {
    list-style: none;
  }
  .checklist li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 0.85rem;
  }
  .checklist li.done {
    text-decoration: line-through;
    color: var(--muted);
  }
  .checklist input[type="checkbox"] {
    accent-color: var(--green);
  }
  .add-subtask-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .add-subtask-row input {
    flex: 1;
    padding: 4px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--fg);
    font-size: 0.8rem;
  }

  /* Empty state */
  .empty-state {
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
    font-size: 0.9rem;
  }

  /* Progress summary */
  .progress-summary {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--muted);
  }
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
    display: flex;
  }
  .progress-segment {
    height: 100%;
    transition: width 0.3s;
  }

  @media (max-width: 900px) {
    .board {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 600px) {
    .board {
      grid-template-columns: 1fr;
      padding: 12px;
    }
    .epic-tabs { padding: 8px 12px 0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Kanban Board</h1>
  <a href="/">Dashboard</a>
  <div class="spacer"></div>
  <button class="btn btn-primary" onclick="openModal('epic-modal')">+ Epic</button>
</div>

<div id="epic-tabs" class="epic-tabs">
  <!-- Populated by JS -->
</div>

<div id="board-container">
  <!-- Board content loaded here -->
</div>

<!-- Create Epic Modal -->
<div id="epic-modal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'epic-modal')">
  <div class="modal">
    <h2>New Epic</h2>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="epic-title" placeholder="e.g. Dashboard Redesign">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="epic-desc" placeholder="What is this epic about?"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeModal('epic-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="createEpic()">Create</button>
    </div>
  </div>
</div>

<!-- Create Task Modal -->
<div id="task-modal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'task-modal')">
  <div class="modal">
    <h2>New Task</h2>
    <input type="hidden" id="task-epic-id">
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="task-title" placeholder="e.g. Add login page">
    </div>
    <div class="form-group">
      <label>Description / Acceptance Criteria</label>
      <textarea id="task-content" placeholder="Detailed instructions..."></textarea>
    </div>
    <div class="form-group">
      <label>Priority</label>
      <select id="task-priority">
        <option value="5">Medium (5)</option>
        <option value="1">Low (1)</option>
        <option value="3">Low-Medium (3)</option>
        <option value="7">High (7)</option>
        <option value="9">Critical (9)</option>
        <option value="10">Urgent (10)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Assign Model</label>
      <select id="task-model">
        <option value="">Unassigned</option>
        <!-- Populated by JS from /api/kanban/models -->
      </select>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeModal('task-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="createTask()">Create</button>
    </div>
  </div>
</div>

<!-- Task Detail Modal -->
<div id="detail-modal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'detail-modal')">
  <div class="modal" style="max-width:560px">
    <h2 id="detail-title">Task</h2>

    <div class="detail-section">
      <h3>Properties</h3>
      <div class="detail-row">
        <label>Status</label>
        <select id="detail-status" onchange="updateTaskDetail()">
          <option value="backlog">Backlog</option>
          <option value="in-progress">In Progress</option>
          <option value="review">Review</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="detail-row">
        <label>Priority</label>
        <select id="detail-priority" onchange="updateTaskDetail()">
          <option value="1">1 — Low</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5" selected>5 — Medium</option>
          <option value="6">6</option>
          <option value="7">7 — High</option>
          <option value="8">8</option>
          <option value="9">9 — Critical</option>
          <option value="10">10 — Urgent</option>
        </select>
      </div>
      <div class="detail-row">
        <label>Model</label>
        <select id="detail-model" onchange="updateTaskDetail()">
          <option value="">Unassigned</option>
          <!-- Populated by JS from /api/kanban/models -->
        </select>
      </div>
    </div>

    <div class="detail-section">
      <h3>Description</h3>
      <div id="detail-content" class="detail-content"></div>
    </div>

    <div class="detail-section">
      <h3>Checklist</h3>
      <ul id="detail-checklist" class="checklist"></ul>
      <div class="add-subtask-row">
        <input type="text" id="new-subtask-title" placeholder="Add checklist item..."
               onkeydown="if(event.key==='Enter')addSubTask()">
        <button class="btn btn-sm" onclick="addSubTask()">Add</button>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-danger btn-sm" onclick="deleteTaskDetail()">Delete</button>
      <button class="btn" onclick="closeModal('detail-modal')">Close</button>
    </div>
  </div>
</div>

<script>
const STATUSES = ['backlog', 'in-progress', 'review', 'done'];
const STATUS_LABELS = {
  'backlog': 'Backlog',
  'in-progress': 'In Progress',
  'review': 'Review',
  'done': 'Done'
};
const STATUS_COLORS = {
  'backlog': '#8b949e',
  'in-progress': '#d29922',
  'review': '#bc8cff',
  'done': '#3fb950'
};

let currentEpicId = null;
let boardData = null;
let currentTaskId = null;

// Populate model dropdowns from the API
async function loadModels() {
  const res = await fetch('/api/kanban/models');
  const models = await res.json();

  const selectors = [
    document.getElementById('task-model'),
    document.getElementById('detail-model'),
  ];

  for (const sel of selectors) {
    if (!sel) continue;
    // Keep the first "Unassigned" option, remove the rest
    while (sel.options.length > 1) {
      sel.remove(1);
    }
    for (const m of models) {
      const opt = document.createElement('option');
      opt.value = m.value;
      opt.textContent = m.label;
      sel.appendChild(opt);
    }
  }
}

// Load board data
async function loadBoard() {
  const res = await fetch('/api/kanban/epics');
  const epics = await res.json();

  // Load all tasks
  const tasksRes = await fetch('/api/kanban/tasks');
  const allTasks = await tasksRes.json();

  // Load subtasks for each task
  const subtasksByTask = {};
  for (const task of allTasks) {
    // We'll load subtasks on demand when opening a task detail
    subtasksByTask[task.id] = [];
  }

  boardData = { epics, allTasks, subtasksByTask };

  // Group tasks by epic
  const tasksByEpic = {};
  for (const t of allTasks) {
    if (!tasksByEpic[t.epic_id]) tasksByEpic[t.epic_id] = [];
    tasksByEpic[t.epic_id].push(t);
  }

  renderTabs(epics, tasksByEpic);

  if (epics.length > 0) {
    if (!currentEpicId || !epics.find(e => e.id === currentEpicId)) {
      currentEpicId = epics[0].id;
    }
    renderBoard(currentEpicId, tasksByEpic);
  } else {
    document.getElementById('board-container').innerHTML =
      '<div class="empty-state">No epics yet. Create one to get started.</div>';
  }
}

function renderTabs(epics, tasksByEpic) {
  const container = document.getElementById('epic-tabs');
  container.innerHTML = '';
  for (const ep of epics) {
    const tasks = tasksByEpic[ep.id] || [];
    const tab = document.createElement('button');
    tab.className = 'epic-tab' + (ep.id === currentEpicId ? ' active' : '');
    tab.innerHTML = ep.title + '<span class="count">(' + tasks.length + ')</span>';
    tab.onclick = () => {
      currentEpicId = ep.id;
      renderTabs(epics, tasksByEpic);
      renderBoard(ep.id, tasksByEpic);
    };
    container.appendChild(tab);
  }
}

function renderBoard(epicId, tasksByEpic) {
  const tasks = (tasksByEpic[epicId] || []).filter(t => t.epic_id === epicId);
  const container = document.getElementById('board-container');

  let html = '<div class="board">';
  for (const status of STATUSES) {
    const colTasks = tasks.filter(t => t.status === status);
    html += renderColumn(status, colTasks);
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderColumn(status, tasks) {
  let html = '<div class="column">';
  html += '<div class="col-header">';
  html += '<span style="color:' + STATUS_COLORS[status] + '">' + STATUS_LABELS[status] + '</span>';
  html += '<span class="col-count">' + tasks.length + '</span>';
  html += '</div>';
  html += '<div class="col-body">';

  for (const t of tasks) {
    html += renderTaskCard(t);
  }

  html += '<button class="add-task-btn" onclick="openTaskModal(\'' + currentEpicId + '\')">+ Add Task</button>';
  html += '</div></div>';
  return html;
}

function renderTaskCard(t) {
  let priorityColor = '#8b949e';
  let priorityLabel = 'medium';
  const p = t.priority || 5;
  if (p >= 9) { priorityColor = '#f85149'; priorityLabel = 'critical'; }
  else if (p >= 7) { priorityColor = '#d29922'; priorityLabel = 'high'; }
  else if (p >= 4) { priorityColor = '#58a6ff'; priorityLabel = 'medium'; }
  else { priorityColor = '#8b949e'; priorityLabel = 'low'; }

  let html = '<div class="task-card" onclick="openTaskDetail(\'' + t.id + '\')">';
  html += '<div class="task-title">' + escapeHtml(t.title) + '</div>';
  html += '<div class="task-meta">';

  if (t.model) {
    html += '<span class="badge badge-model">' + escapeHtml(t.model) + '</span>';
  }

  html += '<span class="badge badge-priority" style="color:' + priorityColor + ';border-color:' + priorityColor + '30">' +
    priorityLabel.toUpperCase() + '</span>';

  if (t.branch) {
    html += '<span class="badge">' + escapeHtml(t.branch) + '</span>';
  }

  html += '</div>';
  html += '</div>';
  return html;
}

function escapeHtml(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// --- Modals ---

function openModal(id) {
  document.getElementById(id).classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function closeModalOnOverlay(event, id) {
  if (event.target === document.getElementById(id)) {
    closeModal(id);
  }
}

// --- Create Epic ---

async function createEpic() {
  const title = document.getElementById('epic-title').value.trim();
  const desc = document.getElementById('epic-desc').value.trim();
  if (!title) return;

  await fetch('/api/kanban/epics', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title, description: desc})
  });

  document.getElementById('epic-title').value = '';
  document.getElementById('epic-desc').value = '';
  closeModal('epic-modal');
  loadBoard();
}

// --- Create Task ---

function openTaskModal(epicId) {
  document.getElementById('task-epic-id').value = epicId;
  document.getElementById('task-title').value = '';
  document.getElementById('task-content').value = '';
  document.getElementById('task-priority').value = '5';
  document.getElementById('task-model').value = '';
  openModal('task-modal');
}

async function createTask() {
  const epicId = document.getElementById('task-epic-id').value;
  const title = document.getElementById('task-title').value.trim();
  const content = document.getElementById('task-content').value.trim();
  const priority = parseInt(document.getElementById('task-priority').value);
  const model = document.getElementById('task-model').value;
  if (!title) return;

  await fetch('/api/kanban/tasks', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({epic_id: epicId, title, content, priority, model})
  });

  closeModal('task-modal');
  loadBoard();
}

// --- Task Detail ---

async function openTaskDetail(taskId) {
  currentTaskId = taskId;
  const res = await fetch('/api/kanban/tasks?epic_id=' + currentEpicId);
  const tasks = await res.json();
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;

  document.getElementById('detail-title').textContent = task.title;
  document.getElementById('detail-status').value = task.status;
  document.getElementById('detail-priority').value = task.priority || 5;
  document.getElementById('detail-model').value = task.model || '';
  document.getElementById('detail-content').textContent = task.content || '(no description)';

  // Load subtasks
  await loadSubTasks(taskId);

  openModal('detail-modal');
}

async function loadSubTasks(taskId) {
  const res = await fetch('/api/kanban/subtasks?task_id=' + taskId);
  const subtasks = await res.json();
  const list = document.getElementById('detail-checklist');
  list.innerHTML = '';
  if (subtasks.length === 0) {
    list.innerHTML = '<li style="color:var(--muted);font-style:italic">No checklist items yet.</li>';
    return;
  }
  for (const st of subtasks) {
    const li = document.createElement('li');
    if (st.completed) li.classList.add('done');
    li.innerHTML = '<input type="checkbox" ' + (st.completed ? 'checked' : '') +
      ' onchange="toggleSubTask(\'' + st.id + '\', this)">'+
      '<span>' + escapeHtml(st.title) + '</span>';
    list.appendChild(li);
  }
}

async function updateTaskDetail() {
  if (!currentTaskId) return;
  const status = document.getElementById('detail-status').value;
  const priority = parseInt(document.getElementById('detail-priority').value);
  const model = document.getElementById('detail-model').value;

  await fetch('/api/kanban/tasks/' + currentTaskId, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status, priority, model})
  });

  loadBoard();
}

async function addSubTask() {
  const input = document.getElementById('new-subtask-title');
  const title = input.value.trim();
  if (!title || !currentTaskId) return;

  const res = await fetch('/api/kanban/subtasks', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({task_id: currentTaskId, title})
  });
  if (!res.ok) return;
  const st = await res.json();

  input.value = '';
  // Remove the "empty" message and add the item
  const list = document.getElementById('detail-checklist');
  if (list.querySelector('li[style*="italic"]')) {
    list.innerHTML = '';
  }
  const li = document.createElement('li');
  li.innerHTML = '<input type="checkbox" onchange="toggleSubTask(\'' + st.id + '\', this)"><span>' + escapeHtml(title) + '</span>';
  list.appendChild(li);
}

async function toggleSubTask(id, checkbox) {
  await fetch('/api/kanban/subtasks/' + id, {method: 'PATCH'});
  const li = checkbox.closest('li');
  if (checkbox.checked) {
    li.classList.add('done');
  } else {
    li.classList.remove('done');
  }
}

async function deleteTaskDetail() {
  if (!currentTaskId) return;
  if (!confirm('Delete this task and all its checklist items?')) return;

  await fetch('/api/kanban/tasks/' + currentTaskId, {method: 'DELETE'});
  closeModal('detail-modal');
  loadBoard();
}

// Auto-refresh board every 30 seconds
setInterval(loadBoard, 30000);

// Initial load
loadModels();
loadBoard();
</script>

</body>

# Jarvis stack — one compose project for every service on this box.
#
#   docker compose up -d                        # everything that runs today (includes worker)
#   docker compose --profile optional up -d     # + wake-queue
#
# Run from the repo root: the project name is then "ai-agent-build", which
# matches the pre-existing rabbitmq container/volume (created 2026-10-24).
# Boot: systemd unit jarvis-stack.service (systemd/ + scripts/install_stack.sh).
# Native systemd units for these services are disabled but kept for rollback:
#   docker compose stop <svc> && sudo systemctl enable --now jarvis-<svc>.service
# See docs/services.md for the full picture.

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: jarvis-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # management UI
      - "127.0.0.1:15692:15692" # Prometheus metrics
      # MQTT (rabbitmq_mqtt plugin) — bound on all interfaces so the
      # Home Assistant box on the LAN can subscribe. Authenticated with
      # the RabbitMQ user (RABBITMQ_DEFAULT_USER/PASS below).
      - "1883:1883"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq:/etc/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-jarvis}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-jarvis-local}

  # Live job stream: the agent runner XADDs the agent's stream-json output
  # as it happens (internal/agentjob/stream.go); the dashboard tails it for
  # GET /jobs/{id} live views (internal/dashboard/live.go). It is also the
  # NoBrakes flag store behind !automode / !fullauto in jarvis-chat.
  # Host-side runners reach it at 127.0.0.1:6379 (JARVIS_REDIS left
  # unset); the dashboard and chat containers reach it at redis:6379
  # (JARVIS_REDIS set below in each service).
  redis:
    image: redis:7
    container_name: jarvis-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]

  # ---------------- the brain ----------------
  # llama.cpp server (pinned b11815 build in /opt/jarvis-engine, installed by
  # scripts/install_engine.sh). The binary is bind-mounted, not baked into the
  # image: it links glibc 2.43 (Ubuntu 26.04) plus the CUDA 13.1 toolkit libs,
  # so the image is a minimal ubuntu:26.04 runtime and the toolkit libs are
  # bind-mounted (see docker/engine/Dockerfile).
  engine:
    build:
      context: .
      dockerfile: docker/engine/Dockerfile
    image: jarvis/engine:local
    container_name: jarvis-engine
    restart: unless-stopped
    # agent's uid on the host: keeps files created in /var/lib/jarvis/slots
    # agent-owned (uid 1001) so host-side tooling can read them. This
    # container is the only brain deployment — no native brain unit exists.
    user: "1001:1001"
    runtime: nvidia
    # nvidia-container-runtime in CDI "auto" mode injects nothing unless a
    # device is requested — this env var selects all GPUs.
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      # CUDA 13.1 toolkit libs (cudart/cublas .so.13) bind-mounted below
      LD_LIBRARY_PATH: /usr/local/cuda-13.1/lib64
    shm_size: "16gb"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - /opt/jarvis-engine:/opt/jarvis-engine:ro
      - /usr/local/cuda-13.1/lib64:/usr/local/cuda-13.1/lib64:ro
      - /var/lib/jarvis/slots:/var/lib/jarvis/slots
    # --host 0.0.0.0: llama-server defaults to 127.0.0.1, which inside the
    # container is unreachable from the host-side port mapping.
    command:
      [ "-m", "/opt/jarvis-engine/models/jarvis-brain.gguf",
        "--host", "0.0.0.0",
        "--port", "11434",
        "--parallel", "2",
        "--ctx-size", "131072",
        "--kv-unified",
        "--jinja",
        "--chat-template-file", "/opt/jarvis-engine/templates/qwen3.8-chat-template.jinja",
        "--cache-type-k", "q4_0",
        "--cache-type-v", "q4_0",
        "--slot-save-path", "/var/lib/jarvis/slots",
        "--metrics",
        "--log-disable" ]
    # --metrics: expose the engine's Prometheus endpoint at /metrics
    # (llamacpp:* counters — prompt/generation tokens, decode seconds,
    # live tok/s gauges). Prometheus scrapes it in the "llama_engine"
    # job; it counts ALL traffic to the engine (chat, agent, jobs),
    # not just the worker's queue jobs.

  # ---------------- the iGPU helper (port 11435) ---------------------------
  # The small always-on model (Qwen2.5-3B Q4_K_M) on the Ryzen iGPU,
  # Vulkan. Its own container and its own port: containers reach it by
  # name (jarvis-engine-igpu:11435 on the compose net), the host at
  # 127.0.0.1:11435. It stays up almost the whole time — photo swap
  # windows stop only the brain (the 4090 VRAM holder), never this engine
  # (docs/brain-swap.md). The old host systemd unit jarvis-engine-igpu is
  # disabled (kept for rollback, like the other native units).
  # Binary + model are bind-mounted from /opt/jarvis-igpu (installed by
  # scripts/install_igpu_engine.sh), not baked into the image — see
  # docker/engine-igpu/Dockerfile for the Vulkan runtime bits.
  engine-igpu:
    build:
      context: .
      dockerfile: docker/engine-igpu/Dockerfile
    image: jarvis/engine-igpu:local
    container_name: jarvis-engine-igpu
    restart: unless-stopped
    user: "1001:1001"
    environment:
      # HOME is unset in the container (uid 1001 has no passwd entry),
      # which made llama-server log "Failed to create //.cache" and drop
      # the shader cache. /tmp is writable and ephemeral — the cache is
      # rebuilt per container, cheap for a 3B model.
      HOME: /tmp
    # /dev/dri nodes are root:video / root:render (0660) — the helper's uid
    # needs both device groups to open them (mirrors the old unit's
    # SupplementaryGroups=video render). Numeric GIDs: this docker daemon
    # cannot resolve group names ("no matching entries in group file"),
    # and the GIDs are stable on this host.
    group_add: ["44", "990"]   # video, render
    ports:
      - "127.0.0.1:11435:11435"
    volumes:
      - /opt/jarvis-igpu:/opt/jarvis-igpu:ro
    devices:
      - /dev/dri
    # The iGPU is PCI 0000:0c:00.0 (card2 + renderD129); the 4090 is
    # 0000:01:00.0. The container carries no NVIDIA Vulkan ICD, so the
    # iGPU is its only Vulkan device (Vulkan0) even with all of /dev/dri.
    # `devices:` (not a volume mount) is required: a plain bind of
    # /dev/dri leaves the nodes outside the container's cgroup device
    # whitelist, so open() is denied and Vulkan sees no device.
    # -dev Vulkan0: with only the iGPU's nodes visible the helper's iGPU is
    # device 0 (on the host it is Vulkan1, the NVIDIA card taking index 0).
    command:
      [ "-m", "/opt/jarvis-igpu/models/jarvis-igpu.gguf",
        "--host", "0.0.0.0",
        "--port", "11435",
        "-dev", "Vulkan0",
        "-ngl", "99",
        "--ctx-size", "32768",
        "--jinja",
        "--metrics",
        "--log-disable" ]

  # ---------------- art (photo generation, port 8120) ---------------------
  # Z-Image-Turbo (6B, 8-step turbo) behind a small FastAPI+diffusers app.
  # The brain owns ~20 GB of the 4090 and the art model doesn't fit in the
  # rest, so it runs with sequential CPU offload (submodules stream to the
  # GPU per forward pass); expect tens of seconds per 1024x1024 image.
  # Code: pinned deploy point /opt/jarvis-art (scripts/install_art.sh).
  # Model weights + generated images: /var/lib/jarvis/art/{model,out}.
  art:
    build:
      context: .
      dockerfile: docker/art/Dockerfile
    image: jarvis/art:local
    container_name: jarvis-art
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      HOME: /home/agent
      LISTEN_PORT: "8120"
    # Bound to all interfaces like the dashboard (8080): port 8120 is
    # also the photo gallery site, meant to be opened from the LAN.
    ports:
      - "8120:8120"
    working_dir: /opt/jarvis-art
    command: ["python3", "art_service.py"]
    volumes:
      - /opt/jarvis-art:/opt/jarvis-art
      - /var/lib/jarvis/art:/var/lib/jarvis/art

  # ---------------- t2i model benchmark (port 8121) ---------------------
  # Bench harness for picking the next art model: candidate t2i models
  # (bench/models.yaml) x a fixed prompt set (bench/prompts.yaml), blind
  # swipe voting, per-model metrics (plan-jarvis-model-downloader-1793259146).
  # Skeleton only for now — no generation yet. Reuses the art image
  # (py3.12 + torch cu128 + diffusers), so it must come up after art has
  # built jarvis/art:local (the boot unit's `up -d` covers this).
  # Code: pinned deploy point /opt/jarvis-bench (scripts/install_bench.sh).
  # DB: ~/.local/share/jarvis/bench/bench.db; images /var/lib/jarvis/bench/imgs,
  # candidate weights /var/lib/jarvis/bench/models.
  # Kill switch (the box's standard boot inhibit): touch
  # /var/lib/jarvis/bench.disabled -> service idles (no GPU, API 503) until
  # the file is removed (it re-enables itself within ~30 s).
  bench:
    image: jarvis/art:local
    container_name: jarvis-bench
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      HOME: /home/agent
      BENCH_HOST: "0.0.0.0"
      BENCH_PORT: "8121"
    # Loopback-only from the host (like memory on 8101): the bench site is
    # for local review, not a LAN service.
    ports:
      - "127.0.0.1:8121:8121"
    working_dir: /opt/jarvis-bench
    command: ["python3", "app.py"]
    volumes:
      - /opt/jarvis-bench:/opt/jarvis-bench
      - /var/lib/jarvis/bench:/var/lib/jarvis/bench
      - /home/agent/.local/share/jarvis/bench:/home/agent/.local/share/jarvis/bench
      # Read the standard kill-switch file; the /var/lib/jarvis/bench mount
      # above stays writable on top of the read-only parent.
      - /var/lib/jarvis:/var/lib/jarvis:ro
      # nvidia-smi for /health VRAM without paying the CUDA context cost
      # (same mount as the ha service).
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro

  # ---------------- reel: jellyfin (media server, port 8096) --------------
  # Stock Jellyfin — the Reel plan's day-1 baseline (docs/reel/jellyfin-baseline.md).
  # Runs on this box, not the Synology, so transcoding can use the 4090's NVENC.
  # Media is bind-mounted read-only: the demo library in /var/lib/jarvis/jellyfin/demo
  # until the NAS share (jarvissdrive) is mounted at /mnt/jarvis — then swap the
  # second mount to /mnt/jarvis/<media> and restart the container (docs, below).
  # Config: /var/lib/jarvis/jellyfin/config on the host; admin credentials live in
  # /home/agent/.config/jarvis/jellyfin.env (chmod 600, never in the repo).
  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jarvis-jellyfin
    restart: unless-stopped
    # nvidia runtime: /dev/nvidia* + driver libs for NVENC (jellyfin-ffmpeg7);
    # hardware transcoding is toggled in .../jellyfin/config/jellyfin.xml.
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
    ports:
      - "8096:8096"
    volumes:
      - /var/lib/jarvis/jellyfin/config:/config
      - /var/lib/jarvis/jellyfin/demo:/media:ro

  # ---------------- chat / dashboard / ha ----------------
  chat:
    build:
      context: .
      dockerfile: docker/jarvis-go/Dockerfile
      args: { BIN: cmd/jarvis-chat }
    image: jarvis/jarvis-chat:local
    container_name: jarvis-chat
    restart: always
    # agentRunUp() (cmd/jarvis-chat/schedule.go) checks the host agent-run
    # loop with pgrep; without the host PID namespace it can never see host
    # processes and reports agent-run "not running" even when it is up. The
    # image side of the check is procps in docker/jarvis-go/Dockerfile.
    pid: host
    env_file:
      - /home/agent/.config/jarvis/agent.env
    environment:
      HOME: /home/agent
      JARVIS_CONF: /home/agent/.config/jarvis
      ENGINE_URL: http://engine:11434
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      DASHBOARD_ADDR: dashboard:8080
      # NoBrakes flag store (!automode / !fullauto) + job live streams.
      # Must be the compose service name: the StreamAddr() default
      # (127.0.0.1:6379) is the container's own loopback, where there is
      # no Redis, so the flag commands could never reach the store.
      JARVIS_REDIS: redis://redis:6379
      # Vector DB over work logs / job history / queue (RAG + search action).
      MEMORY_URL: http://memory:8101
      # Photo generation for the !photo Discord command.
      ART_URL: http://art:8120
      ART_GALLERY_URL: http://111.1.2.27:8120
      # While the worker is deep in a job the brain is saturated, so
      # classify/chat LLM calls route to the iGPU helper engine (its own
      # container, its own port). The worker-busy signal is the job
      # store, already mounted below.
      FALLBACK_ENGINE_URL: http://jarvis-engine-igpu:11435
      FALLBACK_MODEL: jarvis-igpu
    volumes:
      - /home/agent/.config/jarvis:/home/agent/.config/jarvis
      - /home/agent/.local/state/jarvis:/home/agent/.local/state/jarvis
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
      # Discord conversation log (discord-*.md): the daemon defaults to
      # <home>/ai-agent-build/notes/conversations, which only exists on the
      # host — mount it so the container can write the notes.
      - /home/agent/ai-agent-build/notes/conversations:/home/agent/ai-agent-build/notes/conversations
      # !photo reads the generated PNG from the art service's host dir;
      # chat needs it mounted (read-only) to attach it to the DM.
      - /var/lib/jarvis/art:/var/lib/jarvis/art:ro

  dashboard:
    build:
      context: .
      dockerfile: docker/jarvis-go/Dockerfile
      args: { BIN: cmd/dashboard }
    image: jarvis/jarvis-dashboard:local
    container_name: jarvis-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - /home/agent/.config/jarvis/agent.env
    environment:
      HOME: /home/agent
      JARVIS_CONF: /home/agent/.config/jarvis
      ENGINE_URL: http://engine:11434
      # Machine panel (GET /html/machine): the iGPU helper is its own
      # container (jarvis-engine-igpu, port 11435), art and the nvidia
      # exporter are compose services.
      IGPU_URL: http://jarvis-engine-igpu:11435
      ART_URL: http://art:8120
      NVIDIA_EXPORTER_URL: http://nvidia-exporter:3001
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      # Live job streams (see the redis service above); unset means the
      # dashboard falls back to tailing transcript files.
      JARVIS_REDIS: redis://redis:6379
    volumes:
      - /home/agent/.config/jarvis:/home/agent/.config/jarvis
      - /home/agent/.local/state/jarvis:/home/agent/.local/state/jarvis
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis

  ha:
    build:
      context: .
      dockerfile: docker/jarvis-go/Dockerfile
      args: { BIN: cmd/jarvis-ha }
    image: jarvis/jarvis-ha:local
    container_name: jarvis-ha
    restart: unless-stopped
    # nvidia-smi (GPU temp/power sensor) runs inside the container; the
    # nvidia runtime + host binary mount give it driver access, like
    # nvidia-exporter.
    runtime: nvidia
    env_file:
      - /home/agent/.config/jarvis/agent.env
      - /home/agent/.config/jarvis/ha.env
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      HOME: /home/agent
      JARVIS_CONF: /home/agent/.config/jarvis
      HA_MQTT_URL: mqtt://rabbitmq:1883
      HA_ENGINE_URL: http://engine:11434
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /home/agent/.config/jarvis:/home/agent/.config/jarvis
      - /home/agent/.local/state/jarvis:/home/agent/.local/state/jarvis
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis

  # ---------------- voice (STT -> brain -> TTS, ports 8100 + 8443) -------
  # Code is the pinned deploy point /opt/jarvis-voice (see its DEPLOYED_FROM).
  voice:
    build:
      context: .
      dockerfile: docker/voice/Dockerfile
    image: jarvis/voice:local
    container_name: jarvis-voice
    restart: unless-stopped
    ports:
      - "8100:8100"   # plain HTTP — HA integration + machine-to-machine
      - "8443:8443"   # HTTPS — browser UI; the mic (getUserMedia) only works
                      # in secure contexts, so LAN devices must use this
    working_dir: /opt/jarvis-voice
    command: ["python3", "scripts/voice_service.py"]
    env_file:
      - /home/agent/.config/jarvis/local.env
      # wins over local.env: auth OFF until the HA-side jarvis_voice
      # integration sends credentials (see /opt/jarvis-voice/auth-off.env)
      - /opt/jarvis-voice/auth-off.env
    environment:
      HOME: /home/agent
      LISTEN_PORT: "8100"
      WHISPER_MODEL: small
      JARVIS_VOICE: glados
      OLLAMA_URL: http://engine:11434
      MEMORY_URL: http://memory:8101
      # While the worker is deep in a job the 4090 brain is saturated, so
      # conversation LLM calls route to the iGPU helper engine instead —
      # its own container (jarvis-engine-igpu) on its own port.
      FALLBACK_OLLAMA_URL: http://jarvis-engine-igpu:11435
      FALLBACK_MODEL: jarvis-igpu
    volumes:
      - /opt/jarvis-voice:/opt/jarvis-voice
      - /home/agent/.cache/huggingface:/home/agent/.cache/huggingface:ro
      # "Worker busy" signal: each job's state.json (status: running while
      # the agent round is in progress).
      - /home/agent/.local/share/jarvis/jobs:/home/agent/.local/share/jarvis/jobs:ro
      # self-signed TLS cert for the 8443 listener (voice_service.py's default
      # path ~/.config/jarvis/tls/voice.{crt,key}, HOME is /home/agent here);
      # regenerate with scripts/gen_voice_cert.sh after the IP changes
      - /home/agent/.config/jarvis/tls:/home/agent/.config/jarvis/tls:ro

  # ---------------- memory (vector search over work logs, port 8101) --------
  memory:
    build:
      context: .
      dockerfile: docker/memory/Dockerfile
    image: jarvis/memory:local
    container_name: jarvis-memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8101"
    environment:
      HOME: /home/agent
      MEMORY_PORT: "8101"
      # bind wide inside the container; the host-side port mapping
      # (127.0.0.1:8101:8101) keeps it loopback-only from the host
      MEMORY_HOST: "0.0.0.0"
    volumes:
      - /opt/jarvis-memory:/opt/jarvis-memory:ro
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
    command: ["python3", "/opt/jarvis-memory/memory_service.py"]

  # Replaces jarvis-memory-reindex.timer (15 min cadence, 3 min after boot).
  memory-reindex:
    image: jarvis/memory:local
    container_name: jarvis-memory-reindex
    restart: unless-stopped
    environment:
      HOME: /home/agent
    volumes:
      - /opt/jarvis-memory:/opt/jarvis-memory:ro
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
    command: >
      sh -c "sleep 180;
             while true; do
               python3 /opt/jarvis-memory/memory_service.py --reindex;
               sleep 900;
             done"

  # ---------------- optional: raw-queue worker + wake bridge ----------------
  worker:
    build:
      context: .
      dockerfile: docker/jarvis-go/Dockerfile
      args: { BIN: cmd/worker }
    image: jarvis/worker:local
    container_name: jarvis-worker
    restart: always
    env_file:
      - /home/agent/.config/jarvis/agent.env
    environment:
      HOME: /home/agent
      JARVIS_CONF: /home/agent/.config/jarvis
      ENGINE_URL: http://engine:11434
      # The iGPU helper is a different container from the brain, on its own
      # port — the worker routes the registry's host-local 11435 endpoint
      # here instead of collapsing it into the brain (cmd/worker).
      IGPU_URL: http://jarvis-engine-igpu:11435
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      DASHBOARD_ADDR: dashboard:8080
      # B2 plan worker: the registry is read from the host config dir so
      # model changes do not need an image rebuild. ENGINE_URL already
      # takes the worker to the engine for the registry's host-local
      # endpoints (see newPlanHandler in cmd/worker).
      WORKER_MODELS_FILE: /config/models.yaml
      # B3 planning pipeline: prompts + task schema from the repo, and the
      # repo root for the plan step's repo summary (read-only — build work
      # runs on the host, the worker never writes the repo).
      WORKER_PROMPTS_DIR: /prompts
      WORKER_REPO_ROOT: /repo
    volumes:
      - /home/agent/.config/jarvis:/home/agent/.config/jarvis
      - /home/agent/.local/state/jarvis:/home/agent/.local/state/jarvis
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
      - /home/agent/ai-agent-build/config:/config:ro
      - /home/agent/ai-agent-build/prompts:/prompts:ro
      - /home/agent/ai-agent-build:/repo:ro

  wake-queue:
    build:
      context: .
      dockerfile: docker/jarvis-go/Dockerfile
      args: { BIN: cmd/wake-queue }
    image: jarvis/wake-queue:local
    container_name: jarvis-wake-queue
    profiles: ["optional"]
    restart: always
    env_file:
      - /home/agent/.config/jarvis/agent.env
    environment:
      HOME: /home/agent
      JARVIS_CONF: /home/agent/.config/jarvis
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
    volumes:
      - /home/agent/.config/jarvis:/home/agent/.config/jarvis
      - /home/agent/.local/state/jarvis:/home/agent/.local/state/jarvis
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis

  # ---------------- switchboard (event-driven brain, port 9103) ------------
  # Owns listeners — durable "when a message lands on queue Q, do action A"
  # records (plan task 14, docs/event-driven.md, "Parking a round on a
  # result"). It peeks every listened flow queue and wakes the waiting job
  # when a result lands (the round side lands with task 16), forwards a
  # message to a target queue, or sends a Discord notification. Listeners are
  # one JSON file each under ~/.local/share/jarvis/listeners (mounted below),
  # so they survive a restart; the poll loop re-reads them every pass and
  # re-connects after a broker restart. /metrics on 9103 is scraped by
  # Prometheus (no host port map, like token-ledger on 9102).
  switchboard:
    build:
      context: .
      dockerfile: docker/jarvis-go/Dockerfile
      args: { BIN: cmd/switchboard }
    image: jarvis/switchboard:local
    container_name: jarvis-switchboard
    restart: always
    env_file:
      - /home/agent/.config/jarvis/agent.env
    environment:
      HOME: /home/agent
      JARVIS_CONF: /home/agent/.config/jarvis
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      LISTEN_ADDR: ":9103"
    volumes:
      - /home/agent/.config/jarvis:/home/agent/.config/jarvis
      - /home/agent/.local/state/jarvis:/home/agent/.local/state/jarvis
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis

  # ---------------- cap-echo (event-driven brain test worker) -------------
  # The fake capability behind the Phase 2 wait/wake gate (plan task 17):
  # consumes cap.echo, sleeps ECHO_DELAY, writes an artifact file to the
  # request's OutDir, and replies with a Result on the flow queue
  # (docs/event-driven.md, "cap.echo test worker"). Artifacts land under
  # ~/.local/share/jarvis/artifacts (the share dir is mounted below), where
  # the woken brain round can read them.
  cap-echo:
    build:
      context: .
      dockerfile: docker/jarvis-go/Dockerfile
      args: { BIN: cmd/cap-echo }
    image: jarvis/cap-echo:local
    container_name: jarvis-cap-echo
    restart: always
    environment:
      HOME: /home/agent
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      ECHO_DELAY: "30s"
      # Lease gating (plan §3.6, task EVB-28): the worker's right to
      # consume is brokered by resourced (VRAM/RAM ledger + the brain's
      # standing lease); resourced unreachable = fail open (the pre-lease
      # behavior), logged.
      RESOURCED_URL: http://resourced:9104
      CAPABILITIES_FILE: /etc/jarvis/capabilities.yaml
    volumes:
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
      # the lease's memory spec (the placement's vram_mb/ram_mb)
      - ./config/capabilities.yaml:/etc/jarvis/capabilities.yaml:ro

  # ---------------- image-gen-worker (image.generate capability) ---------
  # The GPU worker behind cap.image.generate (plan task EVB-20): consumes
  # cap.image.generate, generates on the art service (http://art:8120 — up
  # in the brain's swap window, needs_brain_out), copies the PNG into the
  # request's OutDir, and replies with a Result. Artifacts land under
  # ~/.local/share/jarvis/artifacts (the share dir is mounted below).
  image-gen-worker:
    build:
      context: .
      dockerfile: docker/jarvis-go/Dockerfile
      args: { BIN: cmd/image-gen-worker }
    image: jarvis/image-gen-worker:local
    container_name: jarvis-image-gen-worker
    restart: always
    environment:
      HOME: /home/agent
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      ART_URL: http://art:8120
      # its 12 GB VRAM lease is granted only once the brain's standing
      # lease has left the ledger (the swap window)
      RESOURCED_URL: http://resourced:9104
      CAPABILITIES_FILE: /etc/jarvis/capabilities.yaml
    volumes:
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
      - ./config/capabilities.yaml:/etc/jarvis/capabilities.yaml:ro

  # ---------------- image-describe-worker (image.describe capability) ----
  # The two placements behind cap.image.describe (plan task EVB-21): one
  # binary, IDESC_MODE selects gpu (Qwen3-VL-2B on the 4090's SPARE VRAM,
  # lease-gated per consume session) or cpu (Qwen3-VL-4B in host RAM — the
  # fallback the broker picks when the brain's conversation has eaten the
  # spare). Each runs llama-server as its own coprocess
  # (internal/vlmserver), unloading it after the idle window; the
  # engine/model/CUDA mounts mirror the engine service because the
  # coprocess is the host's pinned llama-server. The nvidia runtime is
  # needed in BOTH modes: the binary links libcuda.so.1, which only the
  # nvidia container runtime injects.
  image-describe-worker-gpu:
    build:
      context: .
      dockerfile: docker/jarvis-vlm-worker/Dockerfile
      args: { BIN: cmd/image-describe-worker }
    image: jarvis/image-describe-worker:local
    container_name: jarvis-image-describe-worker-gpu
    restart: always
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      HOME: /home/agent
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      IDESC_MODE: gpu
      # CUDA 13.1 toolkit libs (cudart .so.13) bind-mounted below
      LD_LIBRARY_PATH: /usr/local/cuda-13.1/lib64
      # the 2B holds ~3.2 GB (bench peak); require 4 GB free so the load
      # cannot race a growing brain conversation
      IDESC_MIN_FREE_MB: "4096"
      # its 3.2 GB VRAM lease is granted only while the brain's standing
      # lease leaves the room (resourced decides, per §3.6)
      RESOURCED_URL: http://resourced:9104
      CAPABILITIES_FILE: /etc/jarvis/capabilities.yaml
    volumes:
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
      - /opt/jarvis-engine:/opt/jarvis-engine:ro
      - /opt/jarvis-vlm:/opt/jarvis-vlm:ro
      - /usr/local/cuda-13.1/lib64:/usr/local/cuda-13.1/lib64:ro
      - ./config/capabilities.yaml:/etc/jarvis/capabilities.yaml:ro

  image-describe-worker-cpu:
    image: jarvis/image-describe-worker:local
    container_name: jarvis-image-describe-worker-cpu
    restart: always
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      HOME: /home/agent
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      IDESC_MODE: cpu
      LD_LIBRARY_PATH: /usr/local/cuda-13.1/lib64
      # the bench's CPU numbers were taken at 16 threads
      IDESC_THREADS: "16"
      # the cpu placement's lease is on the shared RAM pool (resourced)
      RESOURCED_URL: http://resourced:9104
      CAPABILITIES_FILE: /etc/jarvis/capabilities.yaml
    volumes:
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
      - /opt/jarvis-engine:/opt/jarvis-engine:ro
      - /opt/jarvis-vlm:/opt/jarvis-vlm:ro
      - /usr/local/cuda-13.1/lib64:/usr/local/cuda-13.1/lib64:ro
      - ./config/capabilities.yaml:/etc/jarvis/capabilities.yaml:ro

  # ---------------- audio-transcribe-worker (audio.transcribe capability) -
  # The CPU worker behind cap.audio.transcribe (plan task EVB-22): consumes
  # cap.audio.transcribe, transcribes each clip with faster-whisper (Whisper
  # small, CT2 int8 — docs/benchmarks/audio-transcribe-whisper-benchmark.md)
  # as a per-request Python subprocess, and replies with a Result whose
  # artifacts are one JSON + txt per clip plus an index. CPU only — no
  # nvidia runtime, no swap window: it runs alongside the brain (the lease
  # checks host RAM per session). The model is bind-mounted read-only from
  # /opt/jarvis-whisper; clips arrive as read-only refs (the worker never
  # writes to its inputs).
  audio-transcribe-worker:
    build:
      context: .
      dockerfile: docker/jarvis-audio-worker/Dockerfile
      args: { BIN: cmd/audio-transcribe-worker }
    image: jarvis/audio-transcribe-worker:local
    container_name: jarvis-audio-transcribe-worker
    restart: always
    environment:
      HOME: /home/agent
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      # the bench's numbers were taken at 16 threads
      AT_THREADS: "16"
      # the cpu placement's lease is on the shared RAM pool (resourced)
      RESOURCED_URL: http://resourced:9104
      CAPABILITIES_FILE: /etc/jarvis/capabilities.yaml
    volumes:
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
      - /opt/jarvis-whisper:/opt/jarvis-whisper:ro
      - ./config/capabilities.yaml:/etc/jarvis/capabilities.yaml:ro

  # ---------------- llm-small-worker (llm.small capability) --------------
  # The two placements behind cap.llm.small (plan task EVB-23): one
  # binary, LMS_MODE selects gpu (Qwen2.5-7B-Instruct fully on the 4090's
  # SPARE VRAM, ~5.4 GB measured — lease-gated per consume session at
  # 6.5 GB free, i.e. only in the brain's co-scheduling window) or cpu
  # (the same 7B in host RAM, --n-gpu-layers 0 — the fallback the broker
  # picks whenever the brain has eaten the spare). BOUNDARY: the iGPU
  # helper (Qwen2.5-3B on :11435) stays the CONVERSATION fallback during
  # windows; llm.small is for batch sub-tasks only (capabilities.yaml).
  # Each runs llama-server as its own coprocess (internal/vlmserver),
  # unloading it after the idle window; the engine/model/CUDA mounts
  # mirror the engine service because the coprocess is the host's pinned
  # llama-server. The nvidia runtime is needed in BOTH modes: the binary
  # links libcuda.so.1, which only the nvidia container runtime injects.
  llm-small-worker-gpu:
    build:
      context: .
      dockerfile: docker/jarvis-vlm-worker/Dockerfile
      args: { BIN: cmd/llm-small-worker }
    image: jarvis/llm-small-worker:local
    container_name: jarvis-llm-small-worker-gpu
    restart: always
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      HOME: /home/agent
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      LMS_MODE: gpu
      # CUDA 13.1 toolkit libs (cudart .so.13) bind-mounted below
      LD_LIBRARY_PATH: /usr/local/cuda-13.1/lib64
      # the 7B holds ~5.4 GB (bench); require 6.5 GB free so the load
      # only happens in the plan's co-scheduling window (brain out for a
      # 12 GB image job → ~10 GB free). While the idle brain holds the
      # spare (~3.7 GB free), the lease refuses and the cpu placement
      # takes the request.
      LMS_MIN_FREE_MB: "6656"
      # the same window, decided by resourced's ledger (its 5.5 GB VRAM
      # lease is granted only when the brain's standing lease fits around
      # it)
      RESOURCED_URL: http://resourced:9104
      CAPABILITIES_FILE: /etc/jarvis/capabilities.yaml
    volumes:
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
      - /opt/jarvis-engine:/opt/jarvis-engine:ro
      - /opt/jarvis-llm-small:/opt/jarvis-llm-small:ro
      - /usr/local/cuda-13.1/lib64:/usr/local/cuda-13.1/lib64:ro
      - ./config/capabilities.yaml:/etc/jarvis/capabilities.yaml:ro

  llm-small-worker-cpu:
    image: jarvis/llm-small-worker:local
    container_name: jarvis-llm-small-worker-cpu
    restart: always
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      HOME: /home/agent
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      LMS_MODE: cpu
      LD_LIBRARY_PATH: /usr/local/cuda-13.1/lib64
      # the bench's CPU numbers were taken at 16 threads
      LMS_THREADS: "16"
      # the cpu placement's lease is on the shared RAM pool (resourced)
      RESOURCED_URL: http://resourced:9104
      CAPABILITIES_FILE: /etc/jarvis/capabilities.yaml
    volumes:
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
      - /opt/jarvis-engine:/opt/jarvis-engine:ro
      - /opt/jarvis-llm-small:/opt/jarvis-llm-small:ro
      - /usr/local/cuda-13.1/lib64:/usr/local/cuda-13.1/lib64:ro
      - ./config/capabilities.yaml:/etc/jarvis/capabilities.yaml:ro

  # ---------------- bench-worker (bench.run capability) ------------------
  # The worker behind cap.bench.run (plan task EVB-24, the last Phase 3
  # worker): consumes cap.bench.run, runs the existing benchmark tooling as
  # a thin adapter — llama-bench over a model on the iGPU (Vulkan0) or
  # CPU, or the live script against a serving engine (bench: live) — and
  # publishes the scores to the requester's flow queue with a report.md /
  # index.json artifact under the request's OutDir (no ad-hoc result
  # files). One container serves both placements: the device is
  # per-request input, the consumer is a CPU process.
  # /dev/dri + the video/render groups mirror engine-igpu (a plain bind
  # of /dev/dri leaves the nodes outside the cgroup device whitelist); the
  # image carries no NVIDIA ICD, so the 4090 is unreachable — bench work
  # here can never take the brain's GPU. llama-bench + the iGPU models
  # are bind-mounted from /opt/jarvis-igpu; Ollama names in requests
  # resolve through the host's Ollama store (read-only, no copies).
  # Engines for `bench: live` are reached by container name on the
  # compose net (default http://jarvis-engine:11434, the brain).
  bench-worker:
    build:
      context: .
      dockerfile: docker/jarvis-go-vulkan/Dockerfile
      args: { BIN: cmd/bench-worker }
    image: jarvis/bench-worker:local
    container_name: jarvis-bench-worker
    restart: always
    environment:
      HOME: /home/agent
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      # the consumer is a cpu process (the bench's device is per-request
      # input), so its lease is the cpu placement's RAM lease on the
      # shared pool — it can never take the brain's VRAM
      RESOURCED_URL: http://resourced:9104
      CAPABILITIES_FILE: /etc/jarvis/capabilities.yaml
    group_add: ["44", "990"]   # video, render (for /dev/dri, like engine-igpu)
    volumes:
      - /home/agent/.local/share/jarvis:/home/agent/.local/share/jarvis
      - /opt/jarvis-igpu:/opt/jarvis-igpu:ro
      - /usr/share/ollama/.ollama/models:/usr/share/ollama/.ollama/models:ro
      - ./config/capabilities.yaml:/etc/jarvis/capabilities.yaml:ro
    devices:
      - /dev/dri

  # ---------------- monitoring ----------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: jarvis-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      [ "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        # 180d so the Grafana token panels can bucket per month (increase[1M])
        # over several months; the all-time total itself is carried by the
        # token-ledger's persisted counter, not by this retention.
        "--storage.tsdb.retention.time=180d",
        "--web.listen-address=0.0.0.0:9090" ]
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # Persistent all-time token totals (see docs/services.md): polls the
  # engines' llamacpp:* counters, folds restarts into a never-resetting
  # cumulative kept in a host state dir, exposes :9102 for Prometheus.
  token-ledger:
    build:
      context: .
      dockerfile: docker/jarvis-go/Dockerfile
      args: { BIN: cmd/token-ledger }
    image: jarvis/token-ledger:local
    container_name: jarvis-token-ledger
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":9102"
      POLL_INTERVAL: 15s
      STATE_DIR: /state
      # Both engines over the compose network (pinned container_name, which
      # survives container recreation): the brain container and the iGPU
      # helper's own container on its own port.
      ENGINES: "brain=http://jarvis-engine:11434,igpu=http://jarvis-engine-igpu:11435"
    volumes:
      - /home/agent/.local/share/jarvis/token-ledger:/state

  # VRAM/RAM ledger and lease broker (plan task EVB-25; docs/services.md):
  # reads the live memory readings (nvidia-smi + /proc/meminfo, the nvidia
  # runtime + smi wrapper like the ha service), keeps the brain's standing
  # GPU lease, and brokers the capability workers' leases over a localhost
  # HTTP API (POST /lease, DELETE /lease/<id>, GET /state). Every
  # grant/release/deny emits a lease.* event on the events exchange; the
  # window controller (EVB-27) reuses this ledger.
  resourced:
    build:
      context: .
      dockerfile: docker/jarvis-go/Dockerfile
      args: { BIN: cmd/resourced }
    image: jarvis/resourced:local
    container_name: jarvis-resourced
    restart: unless-stopped
    ports:
      - "127.0.0.1:9104:9104"   # lease API + metrics: host localhost only
    runtime: nvidia
    environment:
      LISTEN_ADDR: ":9104"
      REFRESH_INTERVAL: 30s
      RABBITMQ_URL: amqp://jarvis:jarvis-local@rabbitmq:5672
      NVIDIA_VISIBLE_DEVICES: "all"
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro

  grafana:
    image: grafana/grafana:11.4.0
    container_name: jarvis-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # grafana/dashboard.json is provisioned from the repo (the file
      # provider in dashboards/monitoring.yml picks it up by uid and
      # refreshes it on change), so dashboard edits are a compose restart.
      - ./grafana:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  # Host metrics: rootfs is bind-mounted read-only (the --collector.systemd
  # unit from the native unit is dropped — no systemd inside the container).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: jarvis-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      [ "--path.rootfs=/host",
        "--web.listen-address=0.0.0.0:9100" ]
    volumes:
      - /:/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  # nvidia-smi wrapper; the nvidia runtime mounts the driver libs + devices.
  nvidia-exporter:
    build:
      context: .
      dockerfile: docker/nvidia-exporter/Dockerfile
    image: jarvis/nvidia-exporter:local
    container_name: jarvis-nvidia-exporter
    restart: unless-stopped
    ports:
      - "3001:3001"
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
    command: ["3001"]

volumes:
  rabbitmq_data:
  redis_data:
  prometheus_data:
  grafana_data:

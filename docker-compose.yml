version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: jarvis-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"   # AMQP
      - "127.0.0.1:15672:15672" # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq:/etc/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-jarvis}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-jarvis-local}

volumes:
  rabbitmq_data:

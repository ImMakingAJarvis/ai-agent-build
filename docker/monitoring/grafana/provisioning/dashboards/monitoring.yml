apiVersion: 1

providers:
  - name: "default"
    orgId: 1
    folder: ""
    folderTitle: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Repo grafana/ dir, bind-mounted read-only by compose.
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false

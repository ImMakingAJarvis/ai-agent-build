# Prometheus config for the compose stack.
#
# Targets use the container names (jarvis-*), not the compose service
# names: service-name aliases are not guaranteed to survive container
# recreation (the worker container lost its "worker" alias and the whole
# jarvis_worker job flatlined in Grafana on 2026-10-29), while the
# container_name pinned in docker-compose.yml is stable.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["jarvis-node-exporter:9100"]

  - job_name: "nvidia_gpu"
    static_configs:
      - targets: ["jarvis-nvidia-exporter:3001"]

  - job_name: "rabbitmq"
    metrics_path: /metrics
    static_configs:
      - targets: ["jarvis-rabbitmq:15692"]

  - job_name: "jarvis_worker"
    static_configs:
      - targets: ["jarvis-worker:9101"]

  - job_name: "llama_engine"
    metrics_path: /metrics
    static_configs:
      - targets: ["jarvis-engine:11434"]

  # All-time token cumulatives (jarvis_tokens_total), persisted across
  # engine restarts by the ledger container.
  - job_name: "token_ledger"
    static_configs:
      - targets: ["jarvis-token-ledger:9102"]

  # The event-driven brain's wait/wake listener service (plan task 14):
  # active listeners, wakes fired, forwards, timeouts, resubscribes.
  - job_name: "switchboard"
    static_configs:
      - targets: ["jarvis-switchboard:9103"]

  # VRAM/RAM ledger (plan task EVB-25): leases per device (count + MB),
  # the wait queue depth, lease decisions and wait times, live capacities.
  - job_name: "resourced"
    static_configs:
      # Host systemd service (EVB-27); the container is gone. Reached via
      # host.docker.internal (extra_hosts host-gateway in the service).
      - targets: ["host.docker.internal:9104"]

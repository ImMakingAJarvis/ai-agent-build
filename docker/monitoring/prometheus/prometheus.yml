# Copied from /etc/prometheus/prometheus.yml; targets rewritten for the
# compose network (localhost -> service names).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "nvidia_gpu"
    static_configs:
      - targets: ["nvidia-exporter:3001"]

  - job_name: "rabbitmq"
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  # worker only runs with --profile optional; shows DOWN until then.
  - job_name: "jarvis_worker"
    static_configs:
      - targets: ["worker:9101"]

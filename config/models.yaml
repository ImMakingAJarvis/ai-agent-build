# Model registry — the single source of truth for the model selector,
# placement and cost display (docs/work-board/PLAN.md, "Model registry").
# Adding a model is a change to this file, not a code change.
#
# Field reference (known values are enforced by internal/registry):
#   id                 key used in jobs and logs; unique
#   display_name       shown in the selector
#   location           local | cloud — groups the dropdown
#   engine             ollama | llama.cpp | vllm | anthropic | openai-compatible
#                      | whisper (ASR models the audio-transcribe worker
#                      runs through faster-whisper — not a serving engine)
#   endpoint           base URL the worker calls
#   roles              any of: planner, executor, reviewer
#   context_tokens     caps what the planner packs in
#   vram_gb / ram_gb   what the model needs to run; 0 for cloud
#   thinking           budget param name + default ("param:value"); "" = none
#   cost_per_mtok      USD per million tokens, 0 for local (input price;
#                      cloud output is typically several times higher)
#   enabled            false hides the entry without deleting it
#   home_location      gpu | cpu | igpu | cloud | none — where it always runs
#   fallback_location  same values — where it goes if home is unavailable

models:
  # Dense 27B, Q4_K_M, the always-loaded brain model (docs/local-brain.md):
  # 128K context at ~20.4 GB VRAM on the 4090, served by Ollama on 11434.
  # Executor, and planner for small epics.
  - id: qwen3.8-27b
    display_name: Qwen 3.8 27B (dense)
    location: local
    engine: ollama
    endpoint: http://localhost:11434/v1
    roles: [executor, planner]
    context_tokens: 131072
    vram_gb: 20
    ram_gb: 0
    thinking: "thinking_budget:8192"
    cost_per_mtok: 0
    enabled: true
    home_location: gpu
    fallback_location: cpu

  # ~100 GB IQ4_XS MoE, mostly RAM-resident (docs/freetoken-runner.md); the
  # engine (ft serve, llama.cpp-compatible) runs on 11436 while it is armed
  # (11435 is the iGPU helper — see docs/igpu-model-handler.md).
  # Primary local planner once pulled — until then it is hidden, not deleted.
  - id: qwen3.8-flash-next
    display_name: Qwen 3.8 Flash Next (MoE)
    location: local
    engine: llama.cpp
    endpoint: http://localhost:11436/v1
    roles: [planner]
    context_tokens: 131072
    vram_gb: 20
    ram_gb: 80
    thinking: "thinking_budget:8192"
    cost_per_mtok: 0
    enabled: false
    home_location: gpu
    fallback_location: cpu

  # Zhipu GLM 5.3 flash MoE — second local MoE candidate
  # (docs/benchmarks/moe-models-to-benchmark.md). Served the same way as
  # qwen3.8-flash-next (FreeToken ft serve, hybrid strategy, port 11436).
  # Not pulled yet — hidden until the VRAM-cache sweep (Plane project GLM)
  # picks a quant and the model lands. vram/ram are placeholders mirroring
  # the sibling MoE; correct them at pull time.
  - id: glm5.3-flash
    display_name: GLM 5.3 Flash (MoE)
    location: local
    engine: llama.cpp
    endpoint: http://localhost:11436/v1
    roles: [planner]
    context_tokens: 131072
    vram_gb: 20
    ram_gb: 80
    thinking: ""   # TBD at pull time — confirm GLM's thinking param
    cost_per_mtok: 0
    enabled: false
    home_location: gpu
    fallback_location: cpu

  # Small local vision models behind the image.describe capability
  # (EVB-21). They are capability resources, not conversational models:
  # the image-describe worker runs each one as its own llama-server
  # coprocess (internal/vlmserver), unloading it after the idle window.
  # The endpoint is the coprocess's in-container API port (IDESC_PORT,
  # default 11510) while it is up; enabled: false keeps them out of the
  # model selector.
  - id: qwen3-vl-2b
    display_name: Qwen3-VL 2B (VLM)
    location: local
    engine: llama.cpp
    endpoint: http://127.0.0.1:11510/v1
    roles: [executor]
    context_tokens: 4096
    vram_gb: 4
    ram_gb: 0
    thinking: ""
    cost_per_mtok: 0
    enabled: false
    home_location: gpu
    fallback_location: cpu

  - id: qwen3-vl-8b
    display_name: Qwen3-VL 8B (VLM)
    location: local
    engine: llama.cpp
    endpoint: http://127.0.0.1:11510/v1
    roles: [executor]
    context_tokens: 4096
    vram_gb: 6
    ram_gb: 7
    thinking: ""
    cost_per_mtok: 0
    enabled: false
    home_location: cpu
    fallback_location: cpu

  # Whisper small (ASR) behind the audio.transcribe capability (EVB-22).
  # A capability resource, not a conversational model: the
  # audio-transcribe worker runs it through faster-whisper (CT2 int8 on
  # CPU) as a per-request subprocess — there is no serving endpoint, so
  # the field names the model dir the subprocess loads (compose mounts
  # /opt/jarvis-whisper read-only; the CT2 files are
  # Systran/faster-whisper-small). context_tokens is Whisper's actual text
  # context (448). enabled: false keeps it out of the model selector.
  - id: whisper-small
    display_name: Whisper small (ASR)
    location: local
    engine: whisper
    endpoint: /opt/jarvis-whisper/models/small
    roles: [executor]
    context_tokens: 448
    vram_gb: 0
    ram_gb: 1
    thinking: ""
    cost_per_mtok: 0
    enabled: false
    home_location: cpu
    fallback_location: none

  # Qwen2.5-7B-Instruct (llm.small capability, EVB-23). A capability
  # resource, not a conversational model: the llm-small worker runs it as
  # its own llama-server coprocess (internal/vlmserver), unloading it
  # after the idle window. The endpoint is the coprocess's in-container
  # API port (LMS_PORT, default 11520) while it is up; enabled: false
  # keeps it out of the model selector. BOUNDARY: the iGPU helper
  # (Qwen2.5-3B on :11435) stays the CONVERSATION fallback during
  # windows — llm.small is for batch sub-tasks only.
  #
  # Sourcing: huggingface.co is IP-blocked from this box (401), so the
  # official Qwen GGUF was pulled from ModelScope (Qwen/
  # Qwen2.5-7B-Instruct-GGUF) — split Q4_K_M file under
  # /opt/jarvis-llm-small/models. Measured: ~5.4 GB VRAM on the 4090
  # (28/28 layers, 8K ctx) or ~630 MiB residual VRAM on CPU (bench doc
  # docs/benchmarks/llm-small-model-benchmark.md).
  - id: qwen2.5-7b-instruct
    display_name: Qwen 2.5 7B Instruct (llm.small)
    location: local
    engine: llama.cpp
    endpoint: http://127.0.0.1:11520/v1
    roles: [executor]
    context_tokens: 8192
    vram_gb: 5.4
    ram_gb: 5
    thinking: ""
    cost_per_mtok: 0
    enabled: false
    home_location: gpu
    fallback_location: cpu

  # Cloud planner and reviewer for big or stuck epics.
  - id: claude-sonnet-5-5
    display_name: Claude Sonnet (cloud)
    location: cloud
    engine: anthropic
    endpoint: https://api.anthropic.com/v1
    roles: [planner, reviewer]
    context_tokens: 200000
    vram_gb: 0
    ram_gb: 0
    thinking: "thinking.budget_tokens:16384"
    cost_per_mtok: 3
    enabled: true
    home_location: cloud
    fallback_location: none

  # Claude Fable 5.1 (cloud) — the most capable widely released model;
  # the top cloud planner for big epics. Planner-only by design
  # (job chat-1794348211-f033): it appears in the plan: selector and runs
  # an epic only when that epic is explicitly labelled plan:claude-fable-5-1
  # — never as a default or fallback for the local planner, and not as an
  # executor or reviewer.
  # thinking: "" — the Fable family always thinks and REJECTS the
  # budget_tokens form (400), so the worker must omit the thinking param
  # entirely; adaptive thinking is the API default.
  # cost_per_mtok is the input price ($10 in / $50 out per MTok).
  - id: claude-fable-5-1
    display_name: Claude Fable (cloud)
    location: cloud
    engine: anthropic
    endpoint: https://api.anthropic.com/v1
    roles: [planner]
    context_tokens: 1000000
    vram_gb: 0
    ram_gb: 0
    thinking: ""
    cost_per_mtok: 10
    enabled: true
    home_location: cloud
    fallback_location: none

# config/capabilities.yaml — the capability catalog (plan §3.5, task EVB-19).
#
# Where every capability can run, what it costs, and how long it takes.
# `jarvis-mq caps` renders this for the model (one line per capability:
# where / cost / queue depth / typical runtime); resourced (task 26) will
# budget it; the brain's round preamble will read it. A capability may
# list several placements — the broker's consumer priority (GPU 10 /
# iGPU 5 / CPU 1) then delivers each request to the best free one.
#
# Worker fields (all required):
#   location          gpu | igpu | cpu | remote:<host>
#   model             model id from config/models.yaml
#   vram_mb           VRAM the placement holds while loaded (0 = none)
#   ram_mb            host RAM it holds
#   needs_brain_out   true = needs the 4090's VRAM free of the brain —
#                     runs in the brain's swap window (docs/brain-swap.md)
#   start             command that brings the placement up ("" = always on)
#   stop              command that frees it again
#   typical_runtime   Go duration — how long one request usually takes
#   idle_s            unload after this many idle seconds (0 = never)
#
# Phase 3 capabilities land as their tasks do (EVB-20..24): their entries
# are added here the same way.

capabilities:
  echo:
    description: "test capability (Phase 2 wait/wake gate): sleeps its delay, writes an artifact, replies"
    workers:
      - location: cpu
        model: echo
        vram_mb: 0
        ram_mb: 64
        needs_brain_out: false
        start: ""
        stop: ""
        typical_runtime: 30s
        idle_s: 0

  image.describe:
    # First-check outcome (EVB-21): the brain build supports --mmproj and
    # a matching Qwen3.8-27B projector is published (unsloth) — a smoke
    # test verified it loads and describes correctly. Future option, in a
    # follow-up job: load the projector on the brain engine itself (brain
    # ~20.4 GB + ~1 GB projector < the 4090's 24.5 GB) so the brain can
    # describe images whenever it is loaded — no swap window. Until then
    # this capability runs on the small dedicated VLMs below.
    description: "image(s) -> caption + text-to-image prompt + tags; one JSON per image plus an index file"
    workers:
      - location: gpu
        model: qwen3-vl-2b
        vram_mb: 3244    # measured peak, Qwen3-VL-2B Q4_K_M + F16 mmproj (bench)
        ram_mb: 2048
        needs_brain_out: false  # fits the spare VRAM even with a busy brain;
                                # the worker's lease checks free VRAM per session
        start: ""
        stop: ""
        typical_runtime: 30s
        idle_s: 300      # the coprocess is unloaded after 5 min idle
      - location: cpu
        model: qwen3-vl-8b
        vram_mb: 580     # measured residual CUDA-context floor (--n-gpu-layers 0
                         # --no-mmproj-offload; the 2B's was 488 — bench)
        ram_mb: 6144     # 8B Q4 + F16 mmproj + KV, host-resident
        needs_brain_out: false
        start: ""
        stop: ""
        typical_runtime: 120s  # bench: 52-175 s per image steady (16 threads);
                               # a cold start's first image takes ~240 s; a
                               # folder request scales per image
        idle_s: 300

  image.generate:
    description: "text-to-image (art service :8120; Z-Image-Turbo, reference photos via FLUX.2 klein)"
    workers:
      - location: gpu
        # zimage-turbo's models.yaml entry lands with the capability
        # models (EVB-20..24); the id is reserved here.
        model: zimage-turbo
        vram_mb: 12288   # ~12 GB of the 4090's 24.5 — why it needs the brain out
        ram_mb: 4096
        needs_brain_out: true
        start: "docker compose up -d art"
        stop: "docker compose stop art"
        typical_runtime: 45s
        idle_s: 300      # the model reload is expensive — hold it 5 min

  audio.transcribe:
    description: "audio/video clip(s) -> text transcript (Whisper small on CPU — faster-whisper/CT2 int8, bench-picked over whisper.cpp: 3.6x faster at equal WER); one JSON + txt per clip plus an index file"
    workers:
      - location: cpu
        model: whisper-small
        vram_mb: 0
        ram_mb: 800     # measured peak RSS, faster-whisper small int8 (bench)
        needs_brain_out: false  # CPU only — the first "alongside the brain,
                                # no window" capability; the worker's lease
                                # checks host RAM per consume session
        start: ""
        stop: ""
        typical_runtime: 30s  # bench RTF ~= 0.14: a ~160 s clip takes ~23 s
                              # plus ~2 s model load; camera clips are shorter
        idle_s: 0             # per-request subprocess: no resident model to unload
